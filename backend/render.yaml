services:
  - type: web
    name: smarthome-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # ── Fill these in via Render Dashboard → Environment ───────────────
      - key: MONGODB_URI
        sync: false           # set manually
      - key: JWT_SECRET
        sync: false
      - key: MQTT_BROKER_URL
        sync: false           # mqtts://xxx.s1.eu.hivemq.cloud:8883
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false           # https://your-app.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: AGENCY_ACCESS_CODE
        sync: false
      - key: CONCIERGE_CODE
        sync: false
